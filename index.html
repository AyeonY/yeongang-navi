<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>연강 내비</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  /* 레이아웃: 휴대폰 폭 한 컬럼 위에 반투명 유리 카드. 배경은 흐린 블루·스카이·페리윙클 덩어리, 핵심 카드는 짙은 블루 */
  --bg: #e8eaf2;
  --ink: #131a36;
  --muted: #586080;
  --glass: rgba(255, 255, 255, 0.50);
  --glass-strong: rgba(255, 255, 255, 0.74);
  --glass-line: rgba(255, 255, 255, 0.78);
  --line: rgba(19, 26, 54, 0.10);
  --blue: #2c50e0;
  --blue-deep: #182b8f;
  --peri: #a6abeb;
  --peri-soft: rgba(166, 171, 235, 0.55);
  --sky: #78b4d6;
  --sky-soft: rgba(120, 180, 214, 0.50);
  --on-blue: #ffffff;
  --ok: #11724d; --ok-soft: rgba(17, 114, 77, 0.12);
  --warn: #8f5600; --warn-soft: rgba(196, 128, 0, 0.14);
  --bad: #b8302a; --bad-soft: rgba(184, 48, 42, 0.12);
  --blob-a: #3a5cf2; --blob-b: #5fb2db; --blob-c: #9ba3f2;
  --shadow: 0 10px 30px rgba(28, 44, 120, 0.10);
  --font-body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-display: "Outfit", "Noto Sans KR", "Apple SD Gothic Neo", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a0f24; --ink: #eef1ff; --muted: #a3abcc;
    --glass: rgba(30, 40, 84, 0.42); --glass-strong: rgba(38, 50, 104, 0.66); --glass-line: rgba(255, 255, 255, 0.14);
    --line: rgba(255, 255, 255, 0.10);
    --blue: #6f8cff; --blue-deep: #2a3fb8; --peri: #8d93e6; --peri-soft: rgba(141, 147, 230, 0.32); --sky: #6fb0d6; --sky-soft: rgba(111, 176, 214, 0.28);
    --ok: #63d6a0; --ok-soft: rgba(99, 214, 160, 0.14); --warn: #f2bb5a; --warn-soft: rgba(242, 187, 90, 0.14); --bad: #ff8c84; --bad-soft: rgba(255, 140, 132, 0.14);
    --blob-a: #2a46d6; --blob-b: #2b7fa8; --blob-c: #5a5fc0;
    --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a0f24; --ink: #eef1ff; --muted: #a3abcc;
  --glass: rgba(30, 40, 84, 0.42); --glass-strong: rgba(38, 50, 104, 0.66); --glass-line: rgba(255, 255, 255, 0.14);
  --line: rgba(255, 255, 255, 0.10);
  --blue: #6f8cff; --blue-deep: #2a3fb8; --peri: #8d93e6; --peri-soft: rgba(141, 147, 230, 0.32); --sky: #6fb0d6; --sky-soft: rgba(111, 176, 214, 0.28);
  --ok: #63d6a0; --ok-soft: rgba(99, 214, 160, 0.14); --warn: #f2bb5a; --warn-soft: rgba(242, 187, 90, 0.14); --bad: #ff8c84; --bad-soft: rgba(255, 140, 132, 0.14);
  --blob-a: #2a46d6; --blob-b: #2b7fa8; --blob-c: #5a5fc0;
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
.num { font-family: var(--font-display); font-variant-numeric: tabular-nums; }

/* 배경: 흐린 블루 덩어리 + 결 무늬 */
.bg-art { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
.bg-art span { position: absolute; border-radius: 50%; filter: blur(70px); opacity: 0.55; }
.bg-art .a { width: 380px; height: 380px; background: var(--blob-a); top: -120px; right: -120px; animation: drift 22s ease-in-out infinite alternate; }
.bg-art .b { width: 320px; height: 320px; background: var(--blob-b); bottom: 10%; left: -140px; animation: drift 26s ease-in-out infinite alternate-reverse; }
.bg-art .c { width: 300px; height: 300px; background: var(--blob-c); top: 38%; right: -100px; animation: drift 30s ease-in-out infinite alternate; }
.bg-art::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(100deg, transparent 0 14px, rgba(255, 255, 255, 0.05) 14px 15px); }
@keyframes drift { to { transform: translate(40px, 60px) scale(1.08); } }

.glass { background: var(--glass); border: 1px solid var(--glass-line); border-radius: 22px; box-shadow: var(--shadow); -webkit-backdrop-filter: blur(18px) saturate(150%); backdrop-filter: blur(18px) saturate(150%); }

.app { position: relative; z-index: 1; max-width: 460px; margin: 0 auto; padding: 0 16px 104px; display: grid; gap: 14px; }

/* 상단 */
.topbar { padding-top: 16px; display: grid; gap: 10px; }
.topbar-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { display: grid; min-width: 0; }
.brand small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top-actions { flex-shrink: 0; }
.brand small { font-size: 12px; color: var(--muted); letter-spacing: 0.02em; }
.brand h1 { margin: 0; font-family: var(--font-display); font-size: 24px; font-weight: 500; letter-spacing: -0.02em; }
.top-actions { display: flex; gap: 6px; }
.pill-btn { white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 999px; cursor: pointer; font-size: 14px; border: 1px solid var(--glass-line); background: var(--glass-strong); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
.pill-btn .num { font-weight: 600; font-size: 15px; }
.mode-tag { font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 6px; background: var(--peri-soft); }
.loc-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.loc-dot.on { background: var(--ok); } .loc-dot.off { background: var(--blue); } .loc-dot.err { background: var(--bad); }

.panel { padding: 14px; display: grid; gap: 12px; }
.panel[hidden] { display: none; }
.seg { display: grid; grid-template-columns: 1fr 1fr; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: var(--glass-strong); }
.seg button { border: 0; background: transparent; padding: 8px; cursor: pointer; font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--blue); color: var(--on-blue); font-weight: 600; }
.field-row { display: flex; gap: 8px; align-items: end; flex-wrap: wrap; }
.field { display: grid; gap: 4px; flex: 1 1 120px; }
.field label { font-size: 13px; color: var(--muted); }
.field input, .field select { border: 1px solid var(--line); border-radius: 12px; background: var(--glass-strong); padding: 8px 10px; min-height: 42px; width: 100%; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--glass-strong); border-radius: 999px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
.chip:hover { border-color: var(--blue); }
.note { font-size: 12px; color: var(--muted); margin: 0; }

.view { display: grid; gap: 14px; }
.view[hidden] { display: none; }
.view-title { margin: 6px 2px 0; font-family: var(--font-display); font-size: 20px; font-weight: 500; letter-spacing: -0.01em; text-wrap: balance; }

.card { padding: 16px; display: grid; gap: 12px; }
.hero { position: relative; overflow: hidden; border-radius: 26px; padding: 18px; color: var(--on-blue); display: grid; gap: 10px; background: linear-gradient(140deg, var(--blue-deep), var(--blue) 60%, var(--sky)); box-shadow: 0 16px 40px rgba(30, 60, 200, 0.28); }
.hero::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 85% 20%, rgba(255, 255, 255, 0.35), transparent 40%), repeating-linear-gradient(115deg, rgba(255, 255, 255, 0.07) 0 2px, transparent 2px 9px); pointer-events: none; }
.hero > * { position: relative; }
.hero .eyebrow { font-size: 12px; opacity: 0.85; letter-spacing: 0.03em; }
.hero .class-name { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.25; text-wrap: balance; }
.hero .place { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
.hero .place .room { font-family: var(--font-display); font-size: 40px; font-weight: 500; line-height: 1; }
.hero .place .bld { font-size: 17px; font-weight: 500; }
.hero .place small { font-size: 13px; opacity: 0.85; width: 100%; }
.hero .foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding-top: 10px; border-top: 1px solid rgba(255, 255, 255, 0.25); }
.hero .foot .big { font-size: 15px; }
.hero .foot .big b { font-family: var(--font-display); font-size: 30px; font-weight: 500; }

.status { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 5px 12px 5px 6px; font-weight: 700; font-size: 14px; background: rgba(255, 255, 255, 0.92); }
.status .ico { width: 20px; height: 20px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 12px; color: #fff; }
.status.ok { color: #11724d; } .status.ok .ico { background: #11724d; }
.status.warn { color: #8f5600; } .status.warn .ico { background: #c27a00; }
.status.bad { color: #b8302a; } .status.bad .ico { background: #b8302a; }

.banner { padding: 10px 14px; border-radius: 16px; background: var(--peri-soft); font-size: 14px; border: 1px solid var(--glass-line); }

.sec-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.sec-head h3 { margin: 0; font-size: 15px; font-weight: 700; }
.sec-head small { color: var(--muted); font-size: 12px; }

.trip { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; align-items: center; padding: 12px 14px; border-radius: 18px; background: var(--glass-strong); border: 1px solid var(--glass-line); }
.trip.mine { background: var(--peri-soft); border-color: var(--peri); }
.trip .dep { font-family: var(--font-display); font-size: 26px; font-weight: 500; }
.trip .info { font-size: 13px; line-height: 1.4; }
.trip .info b { font-size: 15px; }
.trip .info span { color: var(--muted); }
.trip .slack { font-weight: 700; font-size: 15px; text-align: right; white-space: nowrap; }
.slack.ok { color: var(--ok); } .slack.warn { color: var(--warn); } .slack.bad { color: var(--bad); }
.trip .tags { grid-column: 1 / -1; display: flex; gap: 6px; flex-wrap: wrap; }
.tag { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--glass-strong); border: 1px solid var(--line); }
.tag.blue { background: var(--blue); color: var(--on-blue); border-color: var(--blue); }
.tag.src { color: var(--muted); font-weight: 500; }

.tip { font-size: 14px; padding: 12px 14px; border-radius: 16px; background: var(--sky-soft); border: 1px solid var(--glass-line); }
.walk-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.walk-grid div { background: var(--glass-strong); border-radius: 16px; padding: 10px; text-align: center; border: 1px solid var(--glass-line); }
.walk-grid small { display: block; font-size: 12px; color: var(--muted); }
.walk-grid b { font-family: var(--font-display); font-size: 22px; font-weight: 500; }

.btn { display: inline-flex; justify-content: center; align-items: center; gap: 8px; min-height: 50px; padding: 12px 18px; border-radius: 16px; border: 0; background: var(--ink); color: var(--bg); font-weight: 700; cursor: pointer; text-decoration: none; }
.btn.blue { background: var(--blue); color: var(--on-blue); }
.btn.ghost { background: var(--glass-strong); color: var(--ink); border: 1px solid var(--glass-line); }
.btn.danger { background: var(--glass-strong); color: var(--bad); border: 1px solid var(--glass-line); }
.btn.sm { min-height: 38px; padding: 6px 12px; font-size: 14px; border-radius: 12px; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; } .btn-row .btn { flex: 1 1 auto; }

.meta { display: flex; flex-wrap: wrap; gap: 2px 10px; font-size: 12px; color: var(--muted); }
.origin-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 14px; }
.origin-row select { border: 1px solid var(--line); border-radius: 10px; background: var(--glass-strong); padding: 6px 8px; max-width: 100%; }

.rest-row { display: grid; grid-template-columns: 70px 1fr; gap: 10px; padding: 10px 12px; border-radius: 14px; background: var(--glass-strong); border: 1px solid var(--glass-line); }
.rest-row .t { font-family: var(--font-display); font-size: 14px; line-height: 1.3; }
.rest-row .n { font-weight: 700; } .rest-row .p { font-size: 13px; color: var(--muted); }

/* 지도 */
.map { width: 100%; height: auto; display: block; border-radius: 18px; }
.map .ground { fill: var(--glass-strong); }
.map .road { stroke: var(--peri-soft); stroke-width: 12; fill: none; stroke-linecap: round; }
.map .bldg rect { fill: var(--glass-strong); stroke: var(--line); stroke-width: 1.2; }
.map .bldg text { fill: var(--muted); font-size: 10px; font-family: var(--font-body); text-anchor: middle; }
.map .bldg text.code { font-family: var(--font-display); font-size: 9px; }
.map .bldg.dest rect { fill: var(--blue); stroke: var(--blue); }
.map .bldg.dest text { fill: #fff; font-weight: 700; }
.map .bldg.origin rect { stroke: var(--ink); stroke-width: 2; stroke-dasharray: 4 3; }
.map .bldg.origin text { fill: var(--ink); font-weight: 700; }
.map .route { stroke: var(--blue); stroke-width: 4; fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 7 6; }
.map .pin { fill: var(--blue); stroke: #fff; stroke-width: 2; }
.map .start { fill: var(--ink); stroke: #fff; stroke-width: 2; }
.map .lbl { fill: var(--ink); font-size: 10px; font-weight: 700; font-family: var(--font-body); }
.map .fountain { fill: var(--sky-soft); stroke: var(--sky); }

.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.steps li { display: grid; grid-template-columns: 36px 1fr; gap: 10px; align-items: start; padding: 10px 12px; border-radius: 16px; background: var(--glass-strong); border: 1px solid var(--glass-line); }
.steps li.done { opacity: 0.6; } .steps li.done .s-t { text-decoration: line-through; }
.check { width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--blue); background: transparent; color: var(--blue); cursor: pointer; font-weight: 700; display: grid; place-items: center; font-family: var(--font-display); }
.steps li.done .check { background: var(--blue); color: var(--on-blue); }
.s-t { font-weight: 700; } .s-s { font-size: 14px; color: var(--muted); }

.arrived { border-radius: 20px; padding: 14px 16px; display: grid; gap: 4px; border: 1px solid var(--glass-line); }
.arrived.ok { background: var(--ok-soft); } .arrived.ok b { color: var(--ok); }
.arrived.bad { background: var(--bad-soft); } .arrived.bad b { color: var(--bad); }
.arrived b { font-size: 18px; } .arrived p { margin: 0; font-size: 14px; }

/* 시간표 */
.day h3 { margin: 4px 2px 6px; font-size: 13px; color: var(--muted); font-weight: 500; }
.day { display: grid; gap: 8px; }
.class-row { display: grid; grid-template-columns: 64px 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 16px; background: var(--glass); border: 1px solid var(--glass-line); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
.class-row.today { background: var(--peri-soft); }
.class-row .t { font-family: var(--font-display); font-size: 14px; line-height: 1.3; }
.class-row .n { font-weight: 700; } .class-row .p { font-size: 13px; color: var(--muted); }
.row-actions { display: flex; gap: 4px; }
.mini { border: 1px solid var(--line); background: var(--glass-strong); border-radius: 10px; padding: 6px 9px; font-size: 13px; cursor: pointer; }
.mini.del { color: var(--bad); }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.form-grid .full { grid-column: 1 / -1; }
.error { color: var(--bad); font-size: 13px; margin: 0; min-height: 1em; }
.empty { text-align: center; color: var(--muted); padding: 24px 12px; }

/* 통학버스 */
.route-card { padding: 14px; border-radius: 18px; background: var(--glass-strong); border: 1px solid var(--glass-line); display: grid; gap: 6px; }
.route-card.mine { background: var(--peri-soft); border-color: var(--peri); }
.route-card .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.route-card .top b { font-size: 15px; }
.route-card .time { font-family: var(--font-display); font-size: 24px; font-weight: 500; }
.route-card .stops { font-size: 13px; color: var(--muted); }
.route-card details summary { cursor: pointer; color: var(--blue); font-size: 13px; }
.route-card .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.src-list { margin: 0; padding-left: 18px; font-size: 13px; display: grid; gap: 4px; }
.src-list a { color: var(--blue); }

/* 탭바 */
.tabbar { position: fixed; z-index: 6; bottom: 12px; left: 50%; transform: translateX(-50%); width: min(428px, calc(100% - 24px)); display: grid; grid-template-columns: repeat(4, 1fr); padding: 6px; border-radius: 24px; }
.tabbar a { display: grid; justify-items: center; gap: 2px; padding: 7px 0; text-decoration: none; color: var(--muted); font-size: 12px; border-radius: 18px; }
.tabbar svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tabbar a[aria-current="page"] { color: var(--on-blue); background: var(--blue); font-weight: 700; }

.toast { position: fixed; z-index: 10; left: 50%; bottom: 96px; transform: translateX(-50%); width: min(428px, calc(100% - 32px)); padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; gap: 12px; border-radius: 16px; background: var(--ink); color: var(--bg); font-size: 14px; }
.toast[hidden] { display: none; }
.toast button { background: transparent; border: 1px solid currentColor; color: inherit; border-radius: 10px; padding: 4px 10px; cursor: pointer; font-weight: 700; }
.foot-note { font-size: 12px; color: var(--muted); text-align: center; margin: 0; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="bg-art" aria-hidden="true"><span class="a"></span><span class="b"></span><span class="c"></span></div>

<div class="app">
  <header class="topbar">
    <div class="topbar-row">
      <div class="brand"><small>국립목포대학교 도림캠퍼스</small><h1>연강 내비</h1></div>
      <div class="top-actions">
        <button type="button" class="pill-btn" id="locBtn" aria-controls="locPanel" aria-expanded="false"><span class="loc-dot" id="locDot"></span><span id="locText">위치</span></button>
        <button type="button" class="pill-btn" id="clockBtn" aria-controls="timePanel" aria-expanded="false"><span class="mode-tag" id="modeTag">데모</span><span class="num" id="clockText">월 07:50</span></button>
      </div>
    </div>

    <section class="panel glass" id="locPanel" hidden aria-label="현재 위치">
      <div class="sec-head"><h3>현재 위치</h3><small id="locSub">아직 확인하지 않았어요</small></div>
      <p class="note" id="locMsg">위치를 확인하면 캠퍼스 안인지 밖인지 판단해 출발지를 자동으로 정해요. 위치는 이 기기 안에서만 쓰고 어디에도 보내지 않아요.</p>
      <div class="btn-row">
        <button type="button" class="btn blue sm" id="locGet">내 위치 확인</button>
        <button type="button" class="btn ghost sm" id="locSave" hidden>지금 위치를 캠퍼스로 저장</button>
        <button type="button" class="btn ghost sm" id="locClear" hidden>위치 사용 끄기</button>
      </div>
    </section>

    <section class="panel glass" id="timePanel" hidden aria-label="현재 시각 설정">
      <div class="seg" role="group" aria-label="시각 모드">
        <button type="button" id="modeDemo" aria-pressed="true">데모 시각</button>
        <button type="button" id="modeReal" aria-pressed="false">실제 시각</button>
      </div>
      <div class="field-row" id="demoFields">
        <div class="field"><label for="demoDay">요일</label><select id="demoDay"></select></div>
        <div class="field"><label for="demoTime">시각</label><input type="time" id="demoTime" value="07:50"></div>
        <div class="chips"><button type="button" class="chip" id="minus5">−5분</button><button type="button" class="chip" id="plus5">+5분</button></div>
      </div>
      <div class="chips" id="presets" aria-label="시나리오 바로 보기"></div>
      <p class="note">데모 시각을 쓰면 언제 열어도 등교·연강·하교 상황을 확인할 수 있어요.</p>
    </section>

  /* =========================================================
     4. 계산

  function context(n) {

      else if (state.settings.useGeo && state.geo.status === "on") auto = "STOP";

  function plan(ctx, n) {

      var day = (n.day + ctx.offset) % 7;
      if (!isWeekday(day)) return { type: "bus", trips: [], noService: true, walk: walk, inside: inside };
      var all = tripsFor(state.settings.myArea, "in", day).map(function (t) {

  function routeSteps(ctx, p) {

      '<button type="button" class="btn danger sm" id="resetTrips">통학버스 데이터 초기화</button></article>');
    v.innerHTML = h.join("");

    v.querySelectorAll("[data-area]").forEach(function (b) { b.addEventListener("click", function () { state.busArea = b.getAttribute("data-area"); state.editingTrip = null; renderBus(); }); });
    v.querySelectorAll("[data-tmine]").forEach(function (b) {
      b.addEventListener("click", function () {
        var t = tripById(b.getAttribute("data-tmine"));
        state.settings.myArea = t.area;
        if (t.dir === "in") state.settings.myBoard = t.place; else state.settings.myDest = t.place;
        saveSettings(); toast(t.dir === "in" ? "승차 지점을 ‘" + t.place + "’로 정했어요." : "하차 지점을 ‘" + t.place + "’로 정했어요."); render();
      });
    });
    v.querySelectorAll("[data-tedit]").forEach(function (b) { b.addEventListener("click", function () { state.editingTrip = b.getAttribute("data-tedit"); renderBus(); el("tr-dep").focus(); }); });
    v.querySelectorAll("[data-tcancel]").forEach(function (b) { b.addEventListener("click", function () { state.editingTrip = null; renderBus(); }); });
    v.querySelectorAll("[data-tsave]").forEach(function (b) {
      b.addEventListener("click", function () {
        var t = tripById(b.getAttribute("data-tsave")), dep = el("tr-dep").value, etaEl = el("tr-eta");
        if (!dep) return;
        var before = JSON.parse(JSON.stringify(state.trips));
        t.dep = dep; t.fri = null; if (etaEl) { var ev = parseInt(etaEl.value, 10); if (ev >= 5 && ev <= 180) t.eta = ev; }
        t.edited = true; state.editingTrip = null; saveTrips(); render();
        toast(t.place + " " + dep + " 버스를 저장했어요.", function () { state.trips = before; saveTrips(); render(); });
      });
    });
    el("resetTrips").addEventListener("click", function () {
      var before = state.trips; state.trips = JSON.parse(JSON.stringify(TRIPS_DEFAULT)); saveTrips(); render();
      toast("통학버스 데이터를 노선표 값으로 되돌렸어요.", function () { state.trips = before; saveTrips(); render(); });
    });
  }

  /* =========================================================
     10. 라우팅·이벤트
     ========================================================= */
  var TABS = ["today", "route", "timetable", "bus"];
  function readHash() { var t = (location.hash || "").replace("#", ""); return TABS.indexOf(t) >= 0 ? t : "today"; }
  function render() {
    renderTop();
    TABS.forEach(function (t) { el("view-" + t).hidden = t !== state.tab; });
    document.querySelectorAll(".tabbar a").forEach(function (a) { if (a.getAttribute("data-tab") === state.tab) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
    if (state.tab === "today") renderToday(); else if (state.tab === "route") renderRoute(); else if (state.tab === "timetable") renderTimetable(); else renderBus();
  }
  window.addEventListener("hashchange", function () { state.tab = readHash(); render(); window.scrollTo(0, 0); });

  function setDemo(day, min) {
    state.settings.mode = "demo"; state.settings.day = day; state.settings.min = ((min % 1440) + 1440) % 1440;
    state.arrived = null; state.stepsDone = {}; saveSettings(); render();
  }
  function togglePanel(id, btn) {
    var p = el(id), open = p.hidden; p.hidden = !open; el(btn).setAttribute("aria-expanded", String(open));
  }
  el("demoDay").innerHTML = [1, 2, 3, 4, 5, 6, 0].map(function (d) { return '<option value="' + d + '">' + DAYS[d] + "요일</option>"; }).join("");
  el("presets").innerHTML = PRESETS.map(function (p, i) { return '<button type="button" class="chip" data-preset="' + i + '">' + p.label + "</button>"; }).join("");
  el("clockBtn").addEventListener("click", function () { togglePanel("timePanel", "clockBtn"); });
  el("locBtn").addEventListener("click", function () { togglePanel("locPanel", "locBtn"); });
  el("modeDemo").addEventListener("click", function () { state.settings.mode = "demo"; saveSettings(); render(); });
  el("modeReal").addEventListener("click", function () { state.settings.mode = "real"; state.arrived = null; saveSettings(); render(); });
  el("demoDay").addEventListener("change", function (e) { setDemo(parseInt(e.target.value, 10), state.settings.min); });
  el("demoTime").addEventListener("change", function (e) { if (e.target.value) setDemo(state.settings.day, toMin(e.target.value)); });
  el("minus5").addEventListener("click", function () { setDemo(state.settings.day, state.settings.min - 5); });
  el("plus5").addEventListener("click", function () { setDemo(state.settings.day, state.settings.min + 5); });
  el("presets").addEventListener("click", function (e) {
    var b = e.target.closest("[data-preset]"); if (!b) return;
    var p = PRESETS[parseInt(b.getAttribute("data-preset"), 10)];
    state.settings.loc = "auto"; setDemo(p.day, p.min);
    el("timePanel").hidden = true; el("clockBtn").setAttribute("aria-expanded", "false");
    if (state.tab !== "today") location.hash = "today";
  });
  el("locGet").addEventListener("click", requestGeo);
  el("locClear").addEventListener("click", function () { state.settings.useGeo = false; state.geo = { status: "idle" }; saveSettings(); render(); });
  el("locSave").addEventListener("click", function () {
    if (state.geo.lat == null) return;
    state.campus.lat = state.geo.lat; state.campus.lng = state.geo.lng; save("mnu_campus", { lat: state.campus.lat, lng: state.campus.lng });
    state.geo.dist = 0; state.geo.status = "on"; toast("지금 위치를 캠퍼스 기준점으로 저장했어요."); render();
  });
  el("toastUndo").addEventListener("click", function () { if (undoFn) { var f = undoFn; undoFn = null; f(); } el("toast").hidden = true; });

  setInterval(function () { if (state.settings.mode === "real") render(); }, 30000);
  state.tab = readHash();
  if (state.settings.useGeo) requestGeo();
  render();

  window.__yk = { context: context, plan: plan, now: now, state: state, fmt: fmt, haversine: haversine };
})();
</script>
</body>
</html>
