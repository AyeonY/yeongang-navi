<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>연강 내비</title>
<meta name="description" content="국립목포대 도림캠퍼스 통학버스와 다음 강의실까지 이동 시간을 한 화면에서 확인하는 웹앱">
<meta name="theme-color" content="#2c50e0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="연강 내비">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="bg-art" aria-hidden="true"><span class="a"></span><span class="b"></span><span class="c"></span></div>

<div class="app">
  <header class="topbar">
    <div class="topbar-row">
      <div class="brand"><small>국립목포대학교 도림캠퍼스</small><h1>연강 내비</h1></div>
      <div class="top-actions">
        <button type="button" class="pill-btn" id="bigBtn" aria-pressed="false" aria-label="글자 크게 보기">가<span aria-hidden="true">+</span></button>
        <button type="button" class="pill-btn" id="locBtn" aria-controls="locPanel" aria-expanded="false"><span class="loc-dot" id="locDot"></span><span id="locText">위치</span></button>
        <button type="button" class="pill-btn" id="clockBtn" aria-controls="timePanel" aria-expanded="false"><span class="mode-tag" id="modeTag">데모</span><span class="num" id="clockText">월 07:50</span></button>
      </div>
    </div>

    <section class="panel glass" id="locPanel" hidden aria-label="현재 위치">
      <div class="sec-head"><h3>현재 위치</h3><small id="locSub">아직 확인하지 않았어요</small></div>
      <p class="note" id="locMsg">위치를 확인하면 캠퍼스 안인지 밖인지 판단해 출발지를 자동으로 정해요. 위치는 이 기기 안에서만 쓰고 어디에도 보내지 않아요.</p>
      <div class="btn-row">
        <button type="button" class="btn blue sm" id="locGet">내 위치 확인</button>
        <button type="button" class="btn ghost sm" id="locSave" hidden>지금 위치를 캠퍼스로 저장</button>
        <button type="button" class="btn ghost sm" id="locClear" hidden>위치 사용 끄기</button>
      </div>
    </section>

    <section class="panel glass" id="timePanel" hidden aria-label="현재 시각 설정">
      <div class="seg" role="group" aria-label="시각 모드">
        <button type="button" id="modeDemo" aria-pressed="true">데모 시각</button>
        <button type="button" id="modeReal" aria-pressed="false">실제 시각</button>
      </div>
      <div class="field-row" id="demoFields">
        <div class="field"><label for="demoDay">요일</label><select id="demoDay"></select></div>
        <div class="field"><label for="demoTime">시각</label><input type="time" id="demoTime" value="07:50"></div>
        <div class="chips"><button type="button" class="chip" id="minus5">−5분</button><button type="button" class="chip" id="plus5">+5분</button></div>
      </div>
      <div class="chips" id="presets" aria-label="시나리오 바로 보기"></div>
      <p class="note">데모 시각을 쓰면 언제 열어도 등교·연강·하교 상황을 확인할 수 있어요.</p>
    </section>
  </header>

  <main class="view-wrap">
    <section class="view" id="view-today"></section>
    <section class="view" id="view-route" hidden></section>
    <section class="view" id="view-timetable" hidden></section>
    <section class="view" id="view-bus" hidden></section>
  </main>
  <p class="foot-note">통학버스 시각은 2026학년도 2학기 노선표(안) 기준이며, 운행 전 학교 통학버스 시스템의 차량 위치에서 한 번 더 확인하세요.</p>
</div>

<nav class="tabbar glass" aria-label="주요 화면">
  <a href="#today" data-tab="today"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M8 10h8M8 14h5"/></svg>오늘</a>
  <a href="#route" data-tab="route"><svg viewBox="0 0 24 24"><path d="M12 21s-6-5.3-6-10a6 6 0 0 1 12 0c0 4.7-6 10-6 10z"/><circle cx="12" cy="11" r="2"/></svg>길 안내</a>
  <a href="#timetable" data-tab="timetable"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 5v15"/></svg>시간표</a>
  <a href="#bus" data-tab="bus"><svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="13" rx="3"/><path d="M5 11h14M8 20l1-3M16 20l-1-3"/></svg>통학버스</a>
</nav>

<div class="toast" id="toast" role="status" aria-live="polite" hidden><span id="toastText"></span><button type="button" id="toastUndo">되돌리기</button></div>

<script src="app.js"></script>
</body>
</html>
